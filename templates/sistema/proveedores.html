<div class="mt-3">
  <h5>Proveedores</h5>
  <form method="post" action="{{ url_for('agregar_proveedor') }}" class="row g-2 mb-3">
    <div class="col"><input name="ruc" class="form-control" placeholder="RUC" required></div>
    <div class="col"><input name="nombre" class="form-control" placeholder="Nombre" required></div>
    <div class="col"><input name="telefono" class="form-control" placeholder="Teléfono" required></div>
    <div class="col"><input name="direccion" class="form-control" placeholder="Dirección" required></div>
    <div class="col"><input name="razon" class="form-control" placeholder="Razón Social"></div>
    <div class="col-auto"><button class="btn btn-success">Guardar</button></div>
  </form>
  <table class="table table-bordered">
    <thead class="table-light"><tr><th>RUC</th><th>Nombre</th><th>Teléfono</th><th>Dirección</th><th>Razón</th></tr></thead>
    <tbody>
      {% for p in proveedores %}
      <tr>
        <td>{{ p.ruc }}</td>
        <td>{{ p.nombre }}</td>
        <td>{{ p.telefono }}</td>
        <td>{{ p.direccion }}</td>
        <td>{{ p.razon }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
